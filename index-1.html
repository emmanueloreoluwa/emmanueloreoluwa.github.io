<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="EmmyteeCreative. Graphic, visual and UI/UX design by Emmanuel, based in Ibadan, Nigeria.">

<title>EmmyteeCreative Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header, left aligned hero with two stacked work thumbnails, 2x2 category cards, then a drill down: Church Designs > church > design detail. */
:root{
  --bg:#FBF9F8; --surface:#FFFFFF; --soft:#F4ECE9; --fg:#241214; --muted:#6E5E5F; --line:#E7DCD9;
  --crimson:#A61C2E; --link:#A61C2E; --orange:#B84E0B; --btn:#A61C2E; --on-btn:#FFFFFF;
  --art-ink:#2A0A10; --art-crimson:#7A0F22; --art-red:#B3203A; --art-orange:#D2661A; --art-gold:#E2B04A;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Inter',system-ui,sans-serif;
  --f-art:Cambria,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#160A0B; --surface:#211113; --soft:#2B181A; --fg:#F6EEEA; --muted:#B9A6A4; --line:#3B2326;
    --crimson:#E5596B; --link:#F0808E; --orange:#EE8A45; --btn:#C42A40; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160A0B; --surface:#211113; --soft:#2B181A; --fg:#F6EEEA; --muted:#B9A6A4; --line:#3B2326;
  --crimson:#E5596B; --link:#F0808E; --orange:#EE8A45; --btn:#C42A40; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:var(--link)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.anchor{scroll-margin-top:64px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font:800 1.05rem/1 var(--f-display)}
.mono{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--btn);color:#fff;font:800 1.1rem/1 var(--f-display)}
nav.main{display:flex;flex-wrap:wrap;gap:2px}
nav.main a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav.main a:hover{color:var(--fg)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--soft)}
.note{background:var(--soft);color:var(--muted);font-size:.8rem}
.note .wrap{padding-block:6px}

/* shared parts */
.eyebrow{font:600 .75rem/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--crimson)}
.btn{display:inline-flex;align-items:center;padding:12px 20px;border-radius:8px;background:var(--btn);color:var(--on-btn);font-weight:600;text-decoration:none;border:1px solid transparent;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:12px}
section.blk{padding-block:48px}
.head2{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;max-width:60ch}
.head2 h2{font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.1;letter-spacing:-.02em}
.head2 p{color:var(--muted)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid.cats{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.card{display:flex;flex-direction:column;gap:14px;min-width:0;text-align:left;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--crimson);transform:translateY(-2px)}
.cbody{display:flex;flex-direction:column;gap:8px;padding:2px 4px 6px;min-width:0}
.cbody h3{font-size:1.2rem;line-height:1.2;letter-spacing:-.01em}
.cbody p{color:var(--muted);font-size:.92rem;line-height:1.5}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.go{font-weight:600;font-size:.9rem;color:var(--link);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .7rem/1 var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip.hot{color:var(--crimson);border-color:var(--crimson)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--muted);padding-top:28px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.page-head{display:flex;flex-direction:column;gap:14px;padding-block:20px 32px;max-width:68ch}
.page-head h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.03em}
.page-head p{color:var(--muted);font-size:1.05rem}
.facts{display:flex;flex-wrap:wrap;gap:12px 32px;margin:6px 0 0;padding:0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{font:600 .7rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:600}

/* hero */
.hero{display:grid;gap:40px;padding-block:56px 40px;align-items:center}
.hero h1{max-width:16ch;font-size:clamp(2.5rem,8.5vw,4.9rem);line-height:1;letter-spacing:-.035em;font-weight:800}
.hero h1 span{color:var(--crimson)}
.hero .copy{display:flex;flex-direction:column;gap:22px}
.hero .copy p{max-width:48ch;font-size:1.1rem;color:var(--muted)}
.hero-art{position:relative;padding-bottom:14%;min-width:0}
.hero-art .a{width:90%;margin-left:auto}
.hero-art .b{position:absolute;left:0;bottom:0;width:34%;border:3px solid var(--bg);border-radius:9px}

/* services */
.svc{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:1px solid var(--line);padding-top:24px}
.svc h3{font-size:1.1rem;margin-bottom:6px}
.svc p{color:var(--muted);font-size:.95rem}
.cta{background:var(--soft);border-radius:14px;padding:32px 24px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.cta h2{font-size:clamp(1.4rem,4vw,2rem);line-height:1.1}
.cta p{color:var(--muted);margin-top:6px}

/* about + contact */
.about{display:grid;gap:32px;padding-block:20px 48px}
.big-mono{display:grid;place-items:center;aspect-ratio:1;max-width:260px;width:100%;border-radius:20px;background:linear-gradient(135deg,var(--art-crimson),var(--art-red) 60%,var(--art-orange));color:#fff;font:800 6rem/1 var(--f-display)}
.portrait{width:100%;max-width:260px;aspect-ratio:1;border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.about .txt{display:flex;flex-direction:column;gap:16px;max-width:60ch}
.about .txt p{color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.skills li{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;background:var(--surface)}
@media (min-width:800px){.about{grid-template-columns:260px 1fr;gap:56px}}
.contact-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));padding-bottom:56px}
.cc{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.cc .val{font:600 1.1rem/1.3 var(--f-display);overflow-wrap:anywhere;user-select:all}
.cc button{align-self:flex-start;margin-top:6px;font:600 .85rem var(--f-body);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}

/* artwork thumbnails (theme independent, they stand in for real designs) */
.thumb{position:relative;overflow:hidden;width:100%;max-width:100%;aspect-ratio:var(--ar,16/9);border-radius:6px;color:#fff;isolation:isolate;container-type:inline-size}
.thumb .orbs{position:absolute;inset:0;z-index:0}
.thumb .orbs i{position:absolute;border-radius:50%;transform:translate(-50%,-50%);aspect-ratio:1}
.thumb.art::after{content:"";position:absolute;inset:5%;border:1px solid rgba(226,176,74,.55);border-radius:2px;z-index:1;pointer-events:none}
.thumb .tt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:9%;gap:3%;font-family:var(--f-art)}
.thumb .tt small{font:600 max(.5rem,3cqw)/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--art-gold)}
.thumb .tt b{font-size:7.5cqw;line-height:1.08;font-weight:700;overflow-wrap:anywhere}
.thumb.flyer .tt b{font-size:10cqw}
.thumb.flyer .tt small{font-size:max(.5rem,4cqw)}
.thumb.ui{background:#F7F2F0;color:#241214;padding:6%;display:flex;flex-direction:column;gap:6%}
.u-bar{height:6%;width:100%;background:#E5D8D4;border-radius:99px;flex:none}
.u-hero{flex:1;border-radius:8px;background:linear-gradient(135deg,var(--art-red),var(--art-orange));padding:6%;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:8%;min-height:0}
.u-hero b{font:800 6.5cqw/1.05 var(--f-display)}
.u-hero span{width:26%;height:11%;min-height:5px;background:#fff;border-radius:99px;display:block}
.u-row{display:flex;gap:4%;height:22%;flex:none}
.u-row i{flex:1;background:#fff;border:1px solid #E5D8D4;border-radius:6px}
.thumb.img{background:var(--soft)}
.thumb.img img{display:block;width:100%;height:100%;object-fit:cover}
.lbart .thumb.img{max-width:460px}

/* detail view */
.lb{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(14,5,6,.74);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lbp{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:100%;max-width:900px;max-height:100%;overflow:auto;padding:16px}
.lbtop{display:flex;justify-content:flex-end;margin-bottom:10px}
.lbtop button{font:600 .85rem var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.lbgrid{display:grid;gap:24px;align-items:start}
.lbinfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.lbinfo h2{font-size:1.8rem;line-height:1.1;letter-spacing:-.02em}
.lbinfo p{color:var(--muted)}
.lbart{display:flex;justify-content:center;min-width:0}
.lbart .thumb{max-width:520px}
.lbart .thumb.flyer{max-width:340px}
@media (min-width:760px){.lbgrid{grid-template-columns:1.25fr 1fr}}

footer{border-top:1px solid var(--line);margin-top:24px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-block:24px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>

/* ---------- helpers ---------- */
var ITEMS = {};
CHURCHES.forEach(function (c) { c.designs.forEach(function (d) {
  d.uid = c.id + '-' + d.id; d.parent = { label: c.name, href: '#church-' + c.id }; ITEMS[d.uid] = d; }); });
CATS.forEach(function (c) { (c.items || []).forEach(function (d) {
  d.uid = c.id + '-' + d.id; d.parent = { label: c.name, href: '#cat-' + c.id }; ITEMS[d.uid] = d; }); });
PROJECTS.forEach(function (p) { p.designs.forEach(function (d) {
  d.uid = 'project-' + p.id + '-' + d.id; d.parent = { label: p.name, href: '#project-' + p.id }; ITEMS[d.uid] = d; }); });

function rnd(seed) { var s = seed * 9301 + 49297; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
var PRESETS = [
  'linear-gradient(135deg,#2A0A10,#7A0F22 55%,#5A0A19)',
  'linear-gradient(160deg,#7A0F22,#B3203A 60%,#D2661A)',
  'linear-gradient(120deg,#2A0A10,#8A2410 60%,#D2661A)',
  'linear-gradient(200deg,#A3182E,#3A0C14)'
];
var ORB = ['rgba(226,176,74,A)', 'rgba(210,102,26,A)', 'rgba(255,140,120,A)'];
function thumb(d) {
  if (d.img) {
    return '<div class="thumb img" style="--ar:' + (d.ar || '4/5') + '"><img src="' + d.img + '" alt="' + d.title + '" loading="lazy"></div>';
  }
  if (d.kind === 'ui') {
    return '<div class="thumb ui" style="--ar:16/10"><div class="u-bar"></div><div class="u-hero"><b>' + d.cover + '</b><span></span></div><div class="u-row"><i></i><i></i><i></i></div></div>';
  }
  var r = rnd(d.seed), orbs = '', i;
  for (i = 0; i < 8; i++) {
    var size = 16 + r() * 34, l = r() * 100, t = r() * 100, a = (0.22 + r() * 0.4).toFixed(2);
    var col = ORB[Math.floor(r() * ORB.length)].replace('A', a);
    orbs += '<i style="width:' + size.toFixed(1) + '%;left:' + l.toFixed(1) + '%;top:' + t.toFixed(1) + '%;background:radial-gradient(circle,' + col + ',rgba(0,0,0,0) 68%)"></i>';
  }
  var ar = d.kind === 'flyer' ? '4/5' : d.kind === 'social' ? '1/1' : '16/9';
  return '<div class="thumb art ' + d.kind + '" style="--ar:' + ar + ';background:' + PRESETS[d.seed % 4] + '"><div class="orbs">' + orbs + '</div><div class="tt"><small>' + d.kicker + '</small><b>' + d.cover + '</b></div></div>';
}
function chips(d) {
  return '<div class="chips"><span class="chip">' + d.type + '</span>' + (d.tag ? '<span class="chip' + (d.tag === 'client' ? ' hot' : '') + '">' + TAGS[d.tag] + '</span>' : '') + '</div>';
}
function designCard(d) {
  return '<button class="card" type="button" data-open="' + d.uid + '">' + thumb(d) + '<div class="cbody">' + chips(d) + '<h3>' + d.title + '</h3><p>' + d.desc + '</p><span class="meta">' + d.meta + '</span></div></button>';
}
function churchCard(c) {
  return '<a class="card" href="#church-' + c.id + '">' + thumb(c.designs[0]) + '<div class="cbody"><span class="meta">' + c.designs.length + ' designs</span><h3>' + c.name + '</h3><p>' + c.blurb + '</p><span class="go">See the designs &rarr;</span></div></a>';
}
function totalDesigns() { return CHURCHES.reduce(function (a, c) { return a + c.designs.length; }, 0); }
function visibleCats() { return CATS.filter(function (c) { return c.id !== 'church' || CHURCHES.length; }); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function projectsIn(id) { return PROJECTS.filter(function (p) { return p.cat === id; }); }
function projectCard(p) {
  return '<a class="card" href="#project-' + p.id + '">' + thumb(p.designs[0]) + '<div class="cbody">' + (p.tag ? '<div class="chips"><span class="chip hot">' + TAGS[p.tag] + '</span></div>' : '') + '<span class="meta">' + p.designs.length + ' designs</span><h3>' + p.name + '</h3><p>' + p.blurb + '</p><span class="go">See the designs &rarr;</span></div></a>';
}
function catCard(c) {
  var ps = projectsIn(c.id);
  var n = c.id === 'church' ? CHURCHES.length + (CHURCHES.length === 1 ? ' church, ' : ' churches, ') + totalDesigns() + ' designs' : plural(c.items.length + ps.length, 'project');
  var cover = c.id === 'church' ? CHURCHES[0].designs[0] : ps.length ? ps[0].designs[0] : c.items[0];
  return '<a class="card" href="#cat-' + c.id + '">' + thumb(cover) + '<div class="cbody"><span class="meta">' + n + '</span><h3>' + c.name + '</h3><p>' + c.blurb + '</p><span class="go">Open ' + c.name + ' &rarr;</span></div></a>';
}
function crumbs(list) {
  return '<nav class="crumbs wrap" aria-label="Breadcrumb">' + list.map(function (x, i) {
    var last = i === list.length - 1;
    return (i ? '<span>/</span>' : '') + (last ? '<span aria-current="page">' + x[0] + '</span>' : '<a href="' + x[1] + '">' + x[0] + '</a>');
  }).join('') + '</nav>';
}
function waBlock() {
  return '<div class="cc"><span class="eyebrow">WhatsApp</span><span class="val" id="c-wa">09136481248</span><div class="row" style="gap:8px;margin-top:6px"><a class="btn" href="https://wa.me/2349136481248" target="_blank" rel="noopener">Chat on WhatsApp</a><button type="button" style="margin-top:0" data-copy="09136481248" data-target="c-wa">Copy</button></div></div>';
}
function socialBlock() {

function copyBlock(label, val, id) {
  return '<div class="cc"><span class="eyebrow">' + label + '</span><span class="val" id="' + id + '">' + val + '</span><button type="button" data-copy="' + val + '" data-target="' + id + '">Copy</button></div>';

/* ---------- pages ---------- */
function pageHome() {
    return '<div class="wrap"><section class="hero"><div class="copy"><span class="eyebrow">Design that feels like you</span>' +
    '<h1>Design that makes people stop and <span>look.</span></h1>' +

    '<div class="grid cats">' + visibleCats().map(catCard).join('') + '</div></section>' +

    '<div id="sec-about" class="anchor">' + pageAbout() + '</div><div id="sec-contact" class="anchor">' + pageContact() + '</div>';

function pageWork() {
  return '<div class="wrap"><div class="page-head" style="padding-top:48px"><span class="eyebrow">Work</span><h1>Everything I have made</h1><p>Choose a category to see the projects and designs inside it.</p></div>' +
    '<div class="grid cats" style="padding-bottom:56px">' + visibleCats().map(catCard).join('') + '</div></div>';
}
function pageCat(id) {
  var c = CATS.filter(function (x) { return x.id === id; })[0];
  if (!c || (id === 'church' && !CHURCHES.length)) return pageWork();
  var body = id === 'church'
    ? '<div class="grid">' + CHURCHES.map(churchCard).join('') + '</div>'
    : '<div class="grid">' + projectsIn(id).map(projectCard).join('') + c.items.map(designCard).join('') + '</div>';
  return crumbs([['Work', '#work'], [c.name, '#cat-' + id]]) +
    '<div class="wrap"><div class="page-head"><span class="eyebrow">' + (id === 'church' ? CHURCHES.length + (CHURCHES.length === 1 ? ' church' : ' churches') : plural(c.items.length + projectsIn(id).length, 'project')) + '</span><h1>' + c.name + '</h1><p>' + c.blurb + '</p></div>' +
    '<div style="padding-bottom:56px">' + body + '</div></div>';
}
function groupedDesigns(list, notes) {
  var order = [], map = {};
  list.forEach(function (d) { var g = d.group || ''; if (!map[g]) { map[g] = []; order.push(g); } map[g].push(d); });
  return order.map(function (g) {
    var note = notes && notes[g] ? '<p>' + notes[g] + '</p>' : '';
    return '<section style="padding-bottom:40px">' + (g ? '<div class="head2" style="margin-bottom:16px;gap:4px"><h2 style="font-size:1.4rem">' + g + '</h2>' + note + '</div>' : '') + '<div class="grid">' + map[g].map(designCard).join('') + '</div></section>';
  }).join('');
}
function pageChurch(id) {
  var c = CHURCHES.filter(function (x) { return x.id === id; })[0];
  if (!c) return pageCat('church');
  var facts = c.facts.concat([['Designs', String(c.designs.length)]]).map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; }).join('');
  var others = CHURCHES.filter(function (x) { return x.id !== id; }).map(churchCard).join('');
  return crumbs([['Work', '#work'], ['Church Designs', '#cat-church'], [c.name, '#church-' + id]]) +
    '<div class="wrap"><div class="page-head"><span class="eyebrow">Church Designs</span><h1>' + c.name + '</h1><p>' + c.long + '</p><dl class="facts">' + facts + '</dl></div>' +
    groupedDesigns(c.designs, c.notes) +
    (others ? '<section class="blk"><div class="head2"><h2>Other churches</h2></div><div class="grid">' + others + '</div></section>' : '') + '</div>';
}
function pageProject(id) {
  var p = PROJECTS.filter(function (x) { return x.id === id; })[0];
  if (!p) return pageWork();
  var c = CATS.filter(function (x) { return x.id === p.cat; })[0];
  var facts = p.facts.concat([['Designs', String(p.designs.length)]]).map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; }).join('');
  return crumbs([['Work', '#work'], [c.name, '#cat-' + c.id], [p.name, '#project-' + id]]) +
    '<div class="wrap"><div class="page-head"><span class="eyebrow">' + c.name + '</span><h1>' + p.name + '</h1><p>' + p.long + '</p><dl class="facts">' + facts + '</dl></div>' +
    '<div class="grid" style="padding-bottom:56px">' + p.designs.map(designCard).join('') + '</div></div>';
}

function pageContact() {

    '<div class="contact-grid">' + copyBlock('Email', 'emmyteecreativeux@gmail.com', 'c-mail') + copyBlock('Alternative email', 'odediranoreoluwa@gmail.com', 'c-mail2') + waBlock() + socialBlock() + copyBlock('Hotline', '09040837644', 'c-hot') +
    '<div class="cc"><span class="eyebrow">Based in</span><span class="val">Ibadan, Nigeria</span><span class="meta">Working with clients anywhere</span></div></div></div>';

/* ---------- router ---------- */
var app = document.getElementById('app');
function setActive(name) {
  document.querySelectorAll('nav.main a').forEach(function (a) {
    if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function spy() {
  var a = document.getElementById('sec-about'), c = document.getElementById('sec-contact');
  if (!a || !c) return;
  var name = 'home';
  if (a.getBoundingClientRect().top <= 160) name = 'about';
  if (c.getBoundingClientRect().top <= 160) name = 'contact';
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) name = 'contact';
  setActive(name);
}
window.addEventListener('scroll', spy, { passive: true });
function route() {
  var h = (location.hash || '#home').slice(1), html, active = 'home';
  if (h === 'home') { html = pageHome(); }
  else if (h === 'work') { html = pageWork(); active = 'work'; }
  else if (h.indexOf('cat-') === 0) { html = pageCat(h.slice(4)); active = 'work'; }
  else if (h.indexOf('church-') === 0) { html = pageChurch(h.slice(7)); active = 'work'; }
  else if (h.indexOf('project-') === 0) { html = pageProject(h.slice(8)); active = 'work'; }
  else if (h === 'about') { html = pageHome(); active = 'about'; }
  else if (h === 'contact') { html = pageHome(); active = 'contact'; }
  else { html = pageHome(); }
  app.innerHTML = html;
  setActive(active);
  closeLb(true);
  var target = (h === 'about' || h === 'contact') ? document.getElementById('sec-' + h) : null;
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  spy();
}
window.addEventListener('hashchange', route);

/* ---------- detail view ---------- */
var lb = document.getElementById('lb'), lbc = document.getElementById('lbc'), lastFocus = null;
function openLb(uid, trigger) {
  var d = ITEMS[uid]; if (!d) return;
  lastFocus = trigger;
  lbc.innerHTML = '<div class="lbgrid"><div class="lbart">' + thumb(d) + '</div><div class="lbinfo">' + chips(d) +
    '<h2 id="lbt">' + d.title + '</h2><p>' + d.desc + '</p><span class="meta">' + d.meta + '</span>' +
    '<p>Part of <a href="' + d.parent.href + '">' + d.parent.label + '</a></p></div></div>';
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('lbx').focus();
}
function closeLb(silent) {
  if (lb.hidden) return;
  lb.hidden = true;
  document.body.style.overflow = '';
  if (!silent && lastFocus && lastFocus.focus) lastFocus.focus();
}
function selectText(id) {
  var el = document.getElementById(id); if (!el) return;
  var r = document.createRange(); r.selectNodeContents(el);
  var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function copyText(btn) {
  var done = function () { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(btn.dataset.copy).then(done).catch(function () { selectText(btn.dataset.target); });
    } else { selectText(btn.dataset.target); }
  } catch (e) { selectText(btn.dataset.target); }
}
document.addEventListener('click', function (e) {
  var o = e.target.closest('[data-open]');
  if (o) { openLb(o.dataset.open, o); return; }
  if (e.target.closest('[data-close]') || e.target === lb) { closeLb(); return; }
  var c = e.target.closest('[data-copy]');
  if (c) copyText(c);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });

route();
</script>
